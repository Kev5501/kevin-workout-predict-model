[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workout-ml"
version = "0.1.0"
description = "Batch inference and continuous training for next-session strength prediction"
requires-python = ">=3.13"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
