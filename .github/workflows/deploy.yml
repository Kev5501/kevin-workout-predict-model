name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.ref.outputs.api }}
      trainer: ${{ steps.ref.outputs.trainer }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"      # registry names are lower case
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          provenance: false
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.name.outputs.base }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - id: trainer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/trainer.Dockerfile
          push: true
          provenance: false
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.name.outputs.base }}/trainer:${{ github.sha }}
          cache-from: type=gha,scope=trainer
          cache-to: type=gha,scope=trainer,mode=max
      - id: ref
        run: |
          echo "api=${{ steps.name.outputs.base }}/api@${{ steps.api.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "trainer=${{ steps.name.outputs.base }}/trainer@${{ steps.trainer.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: images
    # Skipped until the repository variables from Terraform are set.
    if: vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # keyless sign-in to Google Cloud
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Update the service and the job (images pinned by digest)
        run: |
          gcloud run services update workout-api --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" --image "${{ needs.images.outputs.api }}" --quiet
          gcloud run jobs update workout-trainer --project "${{ vars.GCP_PROJECT }}" \
            --region "${{ vars.GCP_REGION }}" --image "${{ needs.images.outputs.trainer }}" --quiet
