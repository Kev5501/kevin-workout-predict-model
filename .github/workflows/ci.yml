name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]      # main runs CI as the first step of Deploy
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt && pip install --no-deps -e .
      - run: ruff check src tests scripts
      - run: pytest

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: docker build -f docker/api.Dockerfile -t workout-api .
      - run: docker build -f docker/trainer.Dockerfile -t workout-trainer .
      - name: End to end on synthetic data (train in one container, predict in the other)
        run: |
          pip install -q -r requirements/dev.txt && pip install -q --no-deps -e .
          python scripts/make_demo_data.py && chmod -R a+rwX .local
          ENVS="-e WML_APP__LOCAL_DIR=/data -e WML_SHEETS__LOCAL_HISTORY=/data/history.parquet"
          # This checks the plumbing, not model quality, so the first model is always accepted.
          docker run --rm $ENVS -e WML_TRAINING__TUNING__N_TRIALS=3 \
            -e WML_TRAINING__PROMOTION__MUST_BEAT_NAIVE=false -v "$PWD/.local:/data" workout-trainer \
            --mode full --trigger initial --reason ci
          chmod -R a+rwX .local 2>/dev/null || sudo chmod -R a+rwX .local
          docker run -d --name api $ENVS -p 8080:8080 -v "$PWD/.local:/data" workout-api
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break || sleep 1; done
          curl -sf localhost:8080/ready
          curl -sf -X POST localhost:8080/v1/predictions/run | tee result.json
          python -c "import json; r = json.load(open('result.json')); assert r['n_predictions'] > 0 and r['sheet_synced'], r"
      - if: failure()
        run: docker logs api || true

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
