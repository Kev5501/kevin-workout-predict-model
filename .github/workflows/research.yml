name: Research tests

# The model-comparison code needs heavy libraries, so it only runs when it or the shared core changes.
on:
  workflow_dispatch:
  pull_request:
    paths: ["research/**", "src/workout_ml/core/**", "requirements/research.txt"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/research.txt
      - run: pip install -r requirements/research.txt && pip install --no-deps -e . -e ./research
      - run: pytest tests -W ignore
        working-directory: research
